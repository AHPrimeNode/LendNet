<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarix — Request Access</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <div class="page">

      <div class="login-box" style="max-width: 480px;">

        <div class="logo">
          <span class="logo-name">CLARIX</span>
          <p class="tagline-en">Lender Access Application</p>
          <p class="tagline-si">ණය දෙන්නන් සඳහා අයදුම්පත</p>
        </div>

        <div class="card">

          <p class="card-title">Request Network Access</p>
          <p class="card-subtitle">Fill in your details and our team will contact you within 24 hours / විස්තර පුරවන්න, අපේ කණ්ඩායම පැය 24 ඇතුළත ඔබව අමතයි</p>

          <div class="field">
            <label>Full Name / සම්පූර්ණ නම *</label>
            <input type="text" placeholder="Your full name" />
          </div>

          <div class="field">
            <label>Business Name / ව්‍යාපාර නම *</label>
            <input type="text" placeholder="Your lending business name" />
          </div>

          <div class="field">
            <label>Business Type / ව්‍යාපාර වර්ගය *</label>
            <select>
              <option value="">Select your business type</option>
              <option>Private Moneylender / පෞද්ගලික මුදල් ණය දෙන්නා</option>
              <option>Gold Pawning Shop / රන් උකස් සාප්පුව</option>
              <option>Microfinance Cooperative / මයික්‍රොෆිනෑන්ස් සමිතිය</option>
              <option>Cheetu / Seettu Operator / චීට්ටු / සීට්ටු ක්‍රියාකරු</option>
              <option>Other / වෙනත්</option>
            </select>
          </div>

          <div class="field">
            <label>District / දිස්ත්‍රික්කය *</label>
            <select>
              <option value="">Select your district</option>
              <option>Colombo / කොළඹ</option>
              <option>Gampaha / ගම්පහ</option>
              <option>Kandy / මහනුවර</option>
              <option>Galle / ගාල්ල</option>
              <option>Matara / මාතර</option>
              <option>Kurunegala / කුරුණෑගල</option>
              <option>Ratnapura / රත්නපුර</option>
              <option>Badulla / බදුල්ල</option>
              <option>Anuradhapura / අනුරාධපුර</option>
              <option>Polonnaruwa / පොළොන්නරුව</option>
              <option>Trincomalee / ත්‍රිකුණාමලය</option>
              <option>Batticaloa / මඩකලපුව</option>
              <option>Jaffna / යාපනය</option>
              <option>Matale / මාතලේ</option>
              <option>Nuwara Eliya / නුවරඑළිය</option>
              <option>Hambantota / හම්බන්තොට</option>
              <option>Kegalle / කෑගල්ල</option>
              <option>Kalutara / කළුතර</option>
              <option>Puttalam / පුත්තලම</option>
              <option>Ampara / අම්පාර</option>
              <option>Monaragala / මොණරාගල</option>
              <option>Vavuniya / වවුනියාව</option>
              <option>Mullaitivu / මුලතිව්</option>
              <option>Kilinochchi / කිලිනොච්චි</option>
              <option>Mannar / මන්නාරම</option>
            </select>
          </div>

          <div class="field">
            <label>Phone Number / දුරකථන අංකය *</label>
            <input type="text" placeholder="07X XXX XXXX" />
          </div>

          <div class="field">
            <label>Approximate number of active loans / සක්‍රිය ණය ගණන *</label>
            <select>
              <option value="">Select range</option>
              <option>1 — 25 loans</option>
              <option>26 — 100 loans</option>
              <option>101 — 500 loans</option>
              <option>500+ loans</option>
            </select>
          </div>

          <div class="field">
            <label>How did you hear about Clarix? / ක්ලැරික්ස් ගැන දැනගත්තේ කෙසේද?</label>
            <select>
              <option value="">Select an option</option>
              <option>Friend or colleague / මිතුරෙකු හෝ සගයෙකු</option>
              <option>Facebook / පේස්බුක්</option>
              <option>WhatsApp / වට්ස්ඇප්</option>
