<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clarix — Query Borrower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1d4ed8" />
    <style>
      /* Page-specific layout only — risk components live in css/style.css */
      .search-form { display: flex; gap: var(--space-3); align-items: flex-start; }
      .search-form .field { flex: 1; margin-bottom: 0; }
      .search-form .field input { font-family: var(--font-mono); letter-spacing: 0.02em; }
      .search-form .field input::placeholder { font-family: var(--font-sans); letter-spacing: 0; }
      /* Line the button up with the input: offset by the label's height (text-sm × 1.5 line-height + label margin) */
      .search-form .btn { flex-shrink: 0; margin-top: calc(var(--text-sm) * 1.5 + var(--space-2)); }
      @media (max-width: 560px) { .search-form { flex-direction: column; align-items: stretch; } .search-form .btn { margin-top: 0; } }

      .pdpa-notice { display: flex; align-items: center; justify-content: center; gap: var(--space-2); text-align: center; font-size: var(--text-xs); color: var(--text-subtle); margin-top: var(--space-4); }

      .profile { display: flex; gap: var(--space-5); align-items: center; }
      .profile-avatar { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--gray-400); display: grid; place-items: center; flex-shrink: 0; }
      .profile-name { font-size: var(--text-lg); font-weight: var(--weight-semi); line-height: var(--leading-tight); margin-bottom: var(--space-3); overflow-wrap: anywhere; }
      .profile-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3) var(--space-5); }
      .profile-meta dt { font-size: var(--text-xs); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.04em; }
      .profile-meta dd { font-size: var(--text-sm); font-weight: var(--weight-medium); overflow-wrap: anywhere; }
      @media (max-width: 768px) { .profile-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 480px) { .profile { align-items: flex-start; } .profile-avatar { width: 44px; height: 44px; } }

      .summary-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
      .summary-stat { background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); min-width: 0; }
      .summary-stat-label { font-size: var(--text-xs); color: var(--text-subtle); margin-bottom: var(--space-1); }
      .summary-stat-value { font-size: var(--text-lg); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .summary-stat-value.danger { color: var(--danger-600); }
      .summary-stat-value.success { color: var(--success-600); }
      @media (max-width: 480px) { .summary-stats { grid-template-columns: 1fr; } }

      .amount-due { color: var(--danger-600); }
      .amount-clear { color: var(--success-600); }

      .btn-flag { color: var(--danger-600); border-color: var(--danger-200); background: var(--danger-50); }
      .btn-flag:hover:not(:disabled) { background: #fee2e2; color: var(--danger-700); }

      /* Dispute modal (form modal — reuses .ui-modal look) */
    </style>
  </head>
  <body style="visibility:hidden;">

    <div id="page-content" hidden>

      <div class="topbar">
        <span class="logo-name">CLARIX</span>
        <div class="topbar-right">
          <span id="lender-name" class="topbar-user"></span>
          <button type="button" class="btn-signout" onclick="signOut()">Sign Out</button>
        </div>
      </div>

      <main class="dashboard-content">

        <h1 class="dash-title">Query a Borrower</h1>
        <p class="dash-subtitle">Search the Clarix network by NIC number / ජාතික හැඳුනුම්පත් අංකයෙන් සොයන්න</p>

        <section class="panel" aria-label="Search">
          <form class="search-form" id="search-form" novalidate role="search">
            <div class="field">
              <label for="nic-input">Borrower NIC / ජාතික හැඳුනුම්පත් අංකය</label>
              <input type="text" id="nic-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 199012345678 or 901234567V" />
              <p class="field-hint">Shows every record for this NIC across the whole Clarix network.</p>
            </div>
            <button type="submit" class="btn btn-brand search-submit" id="search-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              Search / සොයන්න
            </button>
          </form>
        </section>

        <div id="result-area" aria-live="polite"></div>

        <p class="pdpa-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Every query is permanently logged in compliance with the Personal Data Protection Act (2022)
        </p>

      </main>

    </div>

    <!-- ── Dispute Modal ── -->
    <div class="ui-modal-backdrop form-modal-backdrop" id="dispute-modal">
      <div class="ui-modal form-modal" role="dialog" aria-modal="true" aria-labelledby="dispute-title">
        <div class="form-modal-header">
          <h2 class="ui-modal-title" id="dispute-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
            Flag this record
          </h2>
          <button type="button" class="btn btn-ghost btn-icon" onclick="closeDisputeModal()" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="form-modal-body">
          <div id="dispute-msg"></div>
          <dl id="dispute-record-info" class="record-summary"></dl>
          <div id="dispute-form-fields">
            <div class="field">
              <label for="dispute-reason" class="required">Reason for flagging</label>
              <select id="dispute-reason">
                <option value="">— Select a reason —</option>
                <option value="wrong_nic">Wrong NIC — this record is linked to the wrong person</option>
                <option value="wrong_amount">Wrong Amount — the loan or outstanding amount is incorrect</option>
                <option value="already_settled">Already Settled — this loan has been fully repaid</option>
                <option value="false_submission">False Submission — this record is fabricated or malicious</option>
                <option value="identity_mismatch">Identity Mismatch — borrower name does not match NIC</option>
              </select>
            </div>
            <div class="field">
              <label for="dispute-notes">Supporting details <span class="label-optional">(optional)</span></label>
              <textarea id="dispute-notes" placeholder="Add any details that will help the admin review this dispute..."></textarea>
            </div>
          </div>
        </div>
        <div class="form-modal-footer ui-modal-actions" id="dispute-footer">
          <button type="button" class="btn btn-ghost" onclick="closeDisputeModal()">Cancel</button>
          <button type="button" class="btn btn-danger" id="dispute-submit-btn" onclick="submitDispute()">Submit Dispute</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase } from '../js/supabase.js'
      import { calculateRisk } from '../js/risk.js'
      import { fieldError, setLoading } from '../js/ui.js'

      let currentLenderId = null
      let selectedRecordId = null
      let currentRecords = []
      let modalReturnFocus = null

      function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
      }

      const lkr = n => 'LKR ' + (parseFloat(n) || 0).toLocaleString()
      const STATUS_LABELS = { active: 'Active', defaulter: 'Defaulter', partial_default: 'Partial default', settled: 'Settled', restructured: 'Restructured' }
      const statusBadge = s => `<span class="badge badge-${esc(s)}">${esc(STATUS_LABELS[s] || s)}</span>`

      const RISK_ICONS = {
        high: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>',
        medium: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
        low: '<path d="M20 6 9 17l-5-5"/>',
        unknown: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
      }
      const riskIcon = level => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${RISK_ICONS[level]}</svg>`

      const { data: { session } } = await supabase.auth.getSession()

      if (!session) {
        window.location.href = '../index.html'
      } else {
        document.getElementById('page-content').hidden = false
        const phone = session.user.email.replace('@clarix.lk', '')
        document.getElementById('lender-name').textContent = phone

        const { data: lenderData } = await supabase
          .from('lenders')
          .select('id')
          .eq('phone', phone)
          .single()

        if (lenderData) currentLenderId = lenderData.id
      }

      document.getElementById('result-area').addEventListener('click', e => {
        const btn = e.target.closest('.btn-flag')
        if (btn && btn.dataset.recordId) window.openDisputeModal(btn.dataset.recordId, btn)
      })

      document.getElementById('search-form').addEventListener('submit', e => { e.preventDefault(); queryBorrower() })

      window.queryBorrower = async function() {
        const input = document.getElementById('nic-input')
        const nic = input.value.trim()
        const resultArea = document.getElementById('result-area')
        const btn = document.getElementById('search-btn')

        if (!nic) {
          fieldError(input, 'Enter a NIC number to search.')
          input.focus()
          input.addEventListener('input', () => fieldError(input, null), { once: true })
          return
        }
        fieldError(input, null)

        setLoading(btn, true, 'Searching…')
        resultArea.innerHTML = `
          <div class="panel" aria-busy="true">
            <span class="skeleton" style="height:20px;width:40%;margin-bottom:12px;"></span>
            <span class="skeleton" style="height:14px;width:70%;margin-bottom:8px;"></span>
            <span class="skeleton" style="height:14px;width:55%;"></span>
          </div>`

        try {
          await runQuery(nic, resultArea)
        } finally {
          setLoading(btn, false)
        }
      }

      async function runQuery(nic, resultArea) {
        const { data: records, error } = await supabase
          .from('records')
          .select('*')
          .eq('borrower_nic', nic)
          .order('created_at', { ascending: false })

        if (error) {
          resultArea.innerHTML = '<div class="alert alert-danger" role="alert">Error searching the network. Please try again.</div>'
          return
        }

        if (currentLenderId) {
          await supabase.from('queries').insert([{
            lender_id: currentLenderId,
            borrower_nic: nic,
            search_type: 'nic'
          }])
        }

        if (!records || records.length === 0) {
          // First-time borrower = UNKNOWN, not LOW. "No data" is not the same as "safe".
          resultArea.innerHTML = `
            <section class="risk-card risk-unknown">
              <div class="risk-head">
                <span class="risk-icon">${riskIcon('unknown')}</span>
                <div class="risk-head-text">
                  <p class="risk-label">UNKNOWN — First-Time Borrower</p>
                  <p class="risk-sublabel">NIC <strong class="mono">${esc(nic)}</strong> has no records on the Clarix network.</p>
                </div>
              </div>
              <div class="risk-body">
                <p class="risk-callout">This is not a green light — treat as unknown risk.</p>
                <ul class="next-steps">
                  <li>Verify identity with a physical NIC check</li>
                  <li>Ask for at least two references</li>
                  <li>Consider a smaller starter loan to build history</li>
                  <li>Re-query in 1–2 weeks to see if they appear elsewhere on the network</li>
                </ul>
              </div>
            </section>
          `
          return
        }

        currentRecords = records

        // Fetch cross-lender payments + disputes in parallel for Wave 1 scoring signals.
        const recordIds = records.map(r => r.id)
        const [paymentsRes, disputesRes] = await Promise.all([
          // RPC exposes only (record_id, amount) — full payments rows are RLS-scoped to their owner.
          supabase.rpc('payment_amounts', { p_record_ids: recordIds }),
          supabase.from('disputes').select('record_id').in('record_id', recordIds),
        ])
        const paymentsForScoring = paymentsRes.data || []
        const disputesForScoring = disputesRes.data || []

        const risk = calculateRisk(records, paymentsForScoring, disputesForScoring)
        const activeRecords = records.filter(r => r.status === 'active')
        const settledRecords = records.filter(r => r.status === 'settled')
        const totalOutstanding = records.reduce((sum, r) => sum + (parseFloat(r.outstanding) || 0), 0)
        const borrower = records[0]
        const firstSeen = new Date(records[records.length - 1].created_at).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })

        // Positive delta raises risk (red), negative lowers it (green)
        const reasonsHTML = risk.reasons.length > 0
          ? `<div class="risk-reasons">${risk.reasons.map(r => `
              <span class="chip">
                <span class="chip-delta ${r.delta > 0 ? 'up' : 'down'}">${r.delta > 0 ? '+' : ''}${r.delta}</span>${esc(r.text)}
              </span>`).join('')}</div>`
          : ''

        resultArea.innerHTML = `

          <!-- ── Borrower Profile ── -->
          <section class="panel profile" aria-label="Borrower profile">
            <span class="profile-avatar" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <div style="min-width:0;flex:1;">
              <h2 class="profile-name">${esc(borrower.borrower_name)}</h2>
              <dl class="profile-meta">
                <div><dt>NIC</dt><dd class="mono">${esc(nic)}</dd></div>
                <div><dt>Phone</dt><dd class="mono">${esc(borrower.borrower_phone || '—')}</dd></div>
                <div><dt>District</dt><dd>${esc(borrower.borrower_district || '—')}</dd></div>
                <div><dt>On network since</dt><dd>${firstSeen}</dd></div>
              </dl>
            </div>
          </section>

          <!-- ── Risk Assessment ── -->
          <section class="risk-card risk-${risk.level}" aria-label="Risk assessment">
            <div class="risk-head">
              <span class="risk-icon">${riskIcon(risk.level)}</span>
              <div class="risk-head-text">
                <p class="risk-label">${risk.label}</p>
                <p class="risk-sublabel">${risk.sublabel}</p>
              </div>
              <div class="risk-score" aria-label="Risk score ${risk.score} out of 100">
                <span class="risk-score-number">${risk.score}</span>
                <span class="risk-score-denom">/100</span>
              </div>
            </div>
            <div class="risk-body">
              <div class="risk-meter" aria-hidden="true">
                <div class="risk-meter-track"><span class="risk-meter-fill" style="width:${Math.max(2, risk.score)}%"></span></div>
                <div class="risk-meter-scale"><span>Low</span><span style="left:35%">35 · Medium</span><span style="left:70%">70 · High</span></div>
              </div>
              ${reasonsHTML}
              <div class="summary-stats">
                <div class="summary-stat">
                  <p class="summary-stat-label">Active loans</p>
                  <p class="summary-stat-value ${activeRecords.length > 1 ? 'danger' : ''}">${activeRecords.length}</p>
                </div>
                <div class="summary-stat">
                  <p class="summary-stat-label">Total outstanding</p>
                  <p class="summary-stat-value ${totalOutstanding > 0 ? 'danger' : ''}">${lkr(totalOutstanding)}</p>
                </div>
                <div class="summary-stat">
                  <p class="summary-stat-label">Settled loans</p>
                  <p class="summary-stat-value success">${settledRecords.length}</p>
                </div>
              </div>
            </div>
          </section>

          <!-- ── Records ── -->
          <h2 class="section-label">All records on network (${records.length})</h2>
          <div class="table-wrap">
            <table class="table table-stack">
              <thead>
                <tr>
                  <th scope="col">Type</th>
                  <th scope="col" class="num">Loan amount</th>
                  <th scope="col" class="num">Outstanding</th>
                  <th scope="col">Collateral</th>
                  <th scope="col">Status</th>
                  <th scope="col">Date</th>
                  <th scope="col"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody>
                ${records.map(r => `
                  <tr>
                    <td data-label="Type">${esc(r.record_type)}</td>
                    <td data-label="Loan amount" class="num">${lkr(r.loan_amount)}</td>
                    <td data-label="Outstanding" class="num ${parseFloat(r.outstanding) > 0 ? 'amount-due' : 'amount-clear'}">${lkr(r.outstanding)}</td>
                    <td data-label="Collateral">${esc(r.collateral || '—')}</td>
                    <td data-label="Status">${statusBadge(r.status)}</td>
                    <td data-label="Date">${new Date(r.created_at).toLocaleDateString('en-GB')}</td>
                    <td class="actions"><button type="button" class="btn btn-sm btn-flag" data-record-id="${esc(r.id)}" aria-label="Flag ${esc(r.record_type)} record of ${lkr(r.loan_amount)}">Flag</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

        `
      }

      /* ── Dispute Modal Functions ── */

      window.openDisputeModal = function(recordId, trigger) {
        const rec = currentRecords.find(r => r.id === recordId)
        if (!rec) return
        selectedRecordId = recordId
        modalReturnFocus = trigger || document.activeElement

        // Show record details in the modal so the lender confirms which record they are flagging
        document.getElementById('dispute-record-info').innerHTML = `
          <dt>Borrower</dt><dd>${esc(rec.borrower_name)}</dd>
          <dt>NIC</dt><dd class="mono">${esc(rec.borrower_nic)}</dd>
          <dt>Record</dt><dd>${esc(rec.record_type)} · ${lkr(rec.loan_amount)}</dd>
          <dt>Status</dt><dd>${statusBadge(rec.status)}</dd>
        `

        // Reset the form
        const reasonEl = document.getElementById('dispute-reason')
        reasonEl.value = ''
        fieldError(reasonEl, null)
        document.getElementById('dispute-notes').value = ''
        document.getElementById('dispute-msg').innerHTML = ''
        document.getElementById('dispute-form-fields').hidden = false
        const submitBtn = document.getElementById('dispute-submit-btn')
        setLoading(submitBtn, false)
        submitBtn.hidden = false
        submitBtn.textContent = 'Submit Dispute'

        // Show the modal
        document.getElementById('dispute-modal').classList.add('active')
        document.body.style.overflow = 'hidden'
        reasonEl.focus()
      }

      window.closeDisputeModal = function() {
        document.getElementById('dispute-modal').classList.remove('active')
        document.body.style.overflow = ''
        selectedRecordId = null
        if (modalReturnFocus && document.body.contains(modalReturnFocus)) modalReturnFocus.focus()
      }

      window.submitDispute = async function() {
        const reasonEl = document.getElementById('dispute-reason')
        const reason = reasonEl.value
        const notes = document.getElementById('dispute-notes').value.trim()
        const msgArea = document.getElementById('dispute-msg')
        const submitBtn = document.getElementById('dispute-submit-btn')
        const showMsg = (type, text) => { msgArea.innerHTML = `<div class="alert alert-${type}" role="alert">${esc(text)}</div>` }

        // Validate: reason is required
        if (!reason) {
          fieldError(reasonEl, 'Please select a reason for flagging this record.')
          reasonEl.focus()
          reasonEl.addEventListener('change', () => fieldError(reasonEl, null), { once: true })
          return
        }

        // Validate: must be logged in as a lender
        if (!currentLenderId) {
          showMsg('danger', 'Your lender account could not be verified. Please sign out and sign in again.')
          return
        }

        // Disable button to prevent double-click
        setLoading(submitBtn, true, 'Submitting…')
        msgArea.innerHTML = ''

        // Check if this lender already flagged this same record
        const { data: existing, error: checkError } = await supabase
          .from('disputes')
          .select('id')
          .eq('record_id', selectedRecordId)
          .eq('raised_by', currentLenderId)

        if (checkError) {
          showMsg('danger', 'Something went wrong checking for existing disputes. Please try again.')
          setLoading(submitBtn, false)
          return
        }

        if (existing && existing.length > 0) {
          showMsg('warning', 'You have already flagged this record. The admin will review your existing dispute.')
          setLoading(submitBtn, false)
          submitBtn.hidden = true
          return
        }

        // Insert the dispute
        const { error: insertError } = await supabase
          .from('disputes')
          .insert([{
            record_id: selectedRecordId,
            raised_by: currentLenderId,
            reason: reason,
            notes: notes || null,
            status: 'pending'
          }])

        if (insertError) {
          showMsg('danger', 'Failed to submit dispute. Please try again. (' + insertError.message + ')')
          setLoading(submitBtn, false)
          return
        }

        // Log to audit trail
        await supabase.from('audit_log').insert([{
          action: 'dispute_raised',
          lender_id: currentLenderId,
          details: { message: 'Dispute raised on record ' + selectedRecordId + ' — Reason: ' + reason }
        }])

        // Show success — hide form fields
        showMsg('success', 'Dispute submitted. The admin will review this record and take action.')
        document.getElementById('dispute-form-fields').hidden = true
        setLoading(submitBtn, false)
        submitBtn.hidden = true
      }

      // Close modal when clicking outside the box, or with Escape
      document.getElementById('dispute-modal').addEventListener('mousedown', function(e) {
        if (e.target === this) closeDisputeModal()
      })
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('dispute-modal').classList.contains('active')) closeDisputeModal()
      })

      // Deep-link support: insights.html → ?nic=… auto-runs the search.
      const urlNic = new URLSearchParams(window.location.search).get('nic')
      if (urlNic) {
        document.getElementById('nic-input').value = urlNic
        queryBorrower()

        await supabase.auth.signOut()
        window.location.href = '../index.html'
