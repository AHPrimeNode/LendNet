<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarix — Dashboard</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <style>
      body { background-color: #f8fafc; min-height: 100vh; }
      .page { display: none; }
    </style>
  </head>
  <body style="visibility:hidden;">

    <div id="app" style="display:none;">

      <div class="topbar">
        <span class="logo-name" style="font-size:18px;">CLARIX</span>
        <div class="topbar-right">
          <span id="lender-name" style="font-size:13px;color:#94a3b8;margin-right:16px;"></span>
          <button class="btn-signout" onclick="signOut()">Sign Out</button>
        </div>
      </div>

      <div class="dashboard-content">

        <h1 class="dash-title">Dashboard</h1>
        <p class="dash-subtitle">Welcome to Clarix — Informal Lending Intelligence Network</p>

        <div class="dash-cards">
          <div class="dash-card">
            <p class="dash-card-label">Total Records</p>
            <p class="dash-card-value" id="stat-total">—</p>
          </div>
          <div class="dash-card">
            <p class="dash-card-label">Active Loans</p>
            <p class="dash-card-value" id="stat-active">—</p>
          </div>
          <div class="dash-card">
            <p class="dash-card-label">Defaulters</p>
            <p class="dash-card-value" id="stat-defaulters">—</p>
          </div>
          <div class="dash-card">
            <p class="dash-card-label">Queries This Month</p>
            <p class="dash-card-value" id="stat-queries">—</p>
          </div>
        </div>

        <div class="dash-actions">
  <button class="btn-primary" onclick="window.location.href='query-borrower.html'">Query a Borrower</button>
  <button class="btn-secondary" onclick="window.location.href='submit-record.html'">Submit a Record</button>
  <button class="btn-secondary" onclick="window.location.href='my-records.html'">My Records</button>
</div>

      </div>

    </div>

    <script type="module">
      import { supabase } from '../js/supabase.js'

      const { data: { session } } = await supabase.auth.getSession()

      if (!session) {
        window.location.href = '../index.html'
      } else {
        document.getElementById('app').style.display = 'block'
        const phone = session.user.email.replace('@clarix.lk', '')
        document.getElementById('lender-name').textContent = phone

        const { data: lenderData } = await supabase
          .from('lenders')
          .select('id')
          .eq('phone', phone)
          .single()

        if (lenderData) {
          const { data: records } = await supabase
            .from('records')
            .select('*')
            .eq('lender_id', lenderData.id)

          if (records) {
            document.getElementById('stat-total').textContent = records.length
            document.getElementById('stat-active').textContent = records.filter(r => r.status === 'active').length
            document.getElementById('stat-defaulters').textContent = records.filter(r => r.status === 'defaulter').length
          }

          // Queries this lender ran this calendar month
          const now = new Date()
          const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString()
          const { count: queryCount } = await supabase
            .from('queries')
            .select('id', { count: 'exact', head: true })
            .eq('lender_id', lenderData.id)
            .gte('created_at', firstOfMonth)

          document.getElementById('stat-queries').textContent = queryCount ?? 0
        }
      }

      window.signOut = async function() {
        await supabase.auth.signOut()
        window.location.href = '../index.html'
      }
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
      }
    </script>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/lang.js"></script>

    <script src="/js/install.js" defer></script>
  </body>
</html>
